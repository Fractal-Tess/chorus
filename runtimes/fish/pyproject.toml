[project]
name = "chorus-fish-runtime"
version = "0.1.0"
description = "Isolated local Fish Audio S2-Pro inference runtime for Chorus"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "numpy>=2.0,<3",
  "transformers<=4.57.3",
  "safetensors>=0.5,<1",
  "hydra-core>=1.3.2,<2",
  "omegaconf>=2.3,<3",
  "pyrootutils>=1.0.4,<2",
  "click>=8.1,<9",
  "einops>=0.7,<1",
  "loguru>=0.6,<1",
  "tqdm>=4.66,<5",
  "pydantic>=2.9,<3",
  "tiktoken>=0.8,<1",
  "descript-audio-codec>=1.0,<2",
  "soundfile>=0.13,<1",
  "natsort>=8.4,<9",
  "lightning>=2.1,<3",
  "loralib>=0.1.2,<1",
  "rich>=13.5,<15",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.chorus.fish]
upstream_repository = "https://github.com/fishaudio/fish-speech.git"
upstream_revision = "befe4001745417f8c42131739d862b8a6fdbd15a"
model_repository = "https://huggingface.co/fishaudio/s2-pro"
model_revision = "1de9996b6be38b745688de084d87a5633f714e4e"
