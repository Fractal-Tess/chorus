[project]
name = "chorus"
version = "0.1.9"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "huggingface-hub>=1.0",
  "kokoro==0.9.4",
  "lavasr @ git+https://github.com/ysharma3501/LavaSR.git@33ac040892519c1bb4aed7eb32e79af51cc29e2a",
  "kittentts @ https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl",
  "pocket-tts==3.0.2",
  "piper-tts==1.7.0",
  "onnxruntime-gpu[cuda,cudnn]>=1.26,<1.27",
  "soundfile>=0.12.0",
  "supertonic==1.3.1",
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "onnx>=1.18,<2",
  "lameenc==1.8.4",
]

[project.scripts]
serve-api = "chorus.cli:main"
chorus-tts = "chorus.speak:main"

[tool.uv]
package = true
# GPU wheels also provide CPUExecutionProvider; do not install both distributions.
override-dependencies = ["onnxruntime; sys_platform == 'darwin'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chorus"]

[tool.hatch.metadata]
allow-direct-references = true
